services:
  user-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    volumes:
      - user-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  course-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${COURSE_DB_NAME}
      POSTGRES_USER: ${COURSE_DB_USER}
      POSTGRES_PASSWORD: ${COURSE_DB_PASSWORD}
    volumes:
      - course-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  enrollment-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ENROLLMENT_DB_NAME}
      POSTGRES_USER: ${ENROLLMENT_DB_USER}
      POSTGRES_PASSWORD: ${ENROLLMENT_DB_PASSWORD}
    volumes:
      - enrollment-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME}
      POSTGRES_USER: ${PAYMENT_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
    volumes:
      - payment-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - notification-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-db-migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${USER_DB_PASSWORD}
    volumes:
      - ./capstone/helm/user-service/migrations/002.sql:/migrations/002.sql:ro
    command: ["sh", "-c", "psql -h user-postgresql -U ${USER_DB_USER} -d ${USER_DB_NAME} -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())' && psql -h user-postgresql -U ${USER_DB_USER} -d ${USER_DB_NAME} -v ON_ERROR_STOP=1 -f /migrations/002.sql"]
    depends_on:
      user-postgresql:
        condition: service_healthy

  course-db-migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${COURSE_DB_PASSWORD}
    volumes:
      - ./capstone/helm/course-service/migrations/002.sql:/migrations/002.sql:ro
      - ./capstone/helm/course-service/migrations/003.sql:/migrations/003.sql:ro
    command: ["sh", "-c", "psql -h course-postgresql -U ${COURSE_DB_USER} -d ${COURSE_DB_NAME} -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())' && psql -h course-postgresql -U ${COURSE_DB_USER} -d ${COURSE_DB_NAME} -v ON_ERROR_STOP=1 -f /migrations/002.sql && psql -h course-postgresql -U ${COURSE_DB_USER} -d ${COURSE_DB_NAME} -v ON_ERROR_STOP=1 -f /migrations/003.sql"]
    depends_on:
      course-postgresql:
        condition: service_healthy

  enrollment-db-migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${ENROLLMENT_DB_PASSWORD}
    volumes:
      - ./capstone/helm/enrollment-service/migrations/002.sql:/migrations/002.sql:ro
      - ./capstone/helm/enrollment-service/migrations/003.sql:/migrations/003.sql:ro
    command: ["sh", "-c", "psql -h enrollment-postgresql -U ${ENROLLMENT_DB_USER} -d ${ENROLLMENT_DB_NAME} -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())' && psql -h enrollment-postgresql -U ${ENROLLMENT_DB_USER} -d ${ENROLLMENT_DB_NAME} -v ON_ERROR_STOP=1 -f /migrations/002.sql && psql -h enrollment-postgresql -U ${ENROLLMENT_DB_USER} -d ${ENROLLMENT_DB_NAME} -v ON_ERROR_STOP=1 -f /migrations/003.sql"]
    depends_on:
      enrollment-postgresql:
        condition: service_healthy

  payment-db-migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${PAYMENT_DB_PASSWORD}
    volumes:
      - ./capstone/helm/payment-service/migrations/002.sql:/migrations/002.sql:ro
      - ./capstone/helm/payment-service/migrations/003.sql:/migrations/003.sql:ro
    command: ["sh", "-c", "psql -h payment-postgresql -U ${PAYMENT_DB_USER} -d ${PAYMENT_DB_NAME} -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())' && psql -h payment-postgresql -U ${PAYMENT_DB_USER} -d ${PAYMENT_DB_NAME} -v ON_ERROR_STOP=1 -f /migrations/002.sql && psql -h payment-postgresql -U ${PAYMENT_DB_USER} -d ${PAYMENT_DB_NAME} -v ON_ERROR_STOP=1 -f /migrations/003.sql"]
    depends_on:
      payment-postgresql:
        condition: service_healthy

  notification-db-migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - ./capstone/helm/notification-service/migrations/002.sql:/migrations/002.sql:ro
    command: ["sh", "-c", "psql -h notification-postgresql -U ${NOTIFICATION_DB_USER} -d ${NOTIFICATION_DB_NAME} -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())' && psql -h notification-postgresql -U ${NOTIFICATION_DB_USER} -d ${NOTIFICATION_DB_NAME} -v ON_ERROR_STOP=1 -f /migrations/002.sql"]
    depends_on:
      notification-postgresql:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION}
        GIT_COMMIT: ${GIT_COMMIT}
        BUILD_DATE: ${BUILD_DATE}
    image: learnhub/user-service:${APP_VERSION}
    environment:
      SERVICE_NAME: user-service
      PORT: "8080"
      APP_VERSION: ${APP_VERSION}
      RELEASE_ID: ${RELEASE_ID}
      GIT_COMMIT: ${GIT_COMMIT}
      DEPLOYMENT_ENV: compose
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      POSTGRES_HOST: user-postgresql
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8080"
    depends_on:
      user-db-migrate:
        condition: service_completed_successfully

  course-service:
    build:
      context: .
      dockerfile: services/course-service/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION}
        GIT_COMMIT: ${GIT_COMMIT}
        BUILD_DATE: ${BUILD_DATE}
    image: learnhub/course-service:${APP_VERSION}
    environment:
      SERVICE_NAME: course-service
      PORT: "8080"
      APP_VERSION: ${APP_VERSION}
      RELEASE_ID: ${RELEASE_ID}
      GIT_COMMIT: ${GIT_COMMIT}
      DEPLOYMENT_ENV: compose
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      POSTGRES_HOST: course-postgresql
      POSTGRES_DB: ${COURSE_DB_NAME}
      POSTGRES_USER: ${COURSE_DB_USER}
      POSTGRES_PASSWORD: ${COURSE_DB_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: learnhub-content
    ports:
      - "8082:8080"
    depends_on:
      course-db-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  enrollment-service:
    build:
      context: .
      dockerfile: services/enrollment-service/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION}
        GIT_COMMIT: ${GIT_COMMIT}
        BUILD_DATE: ${BUILD_DATE}
    image: learnhub/enrollment-service:${APP_VERSION}
    environment:
      SERVICE_NAME: enrollment-service
      PORT: "8080"
      APP_VERSION: ${APP_VERSION}
      RELEASE_ID: ${RELEASE_ID}
      GIT_COMMIT: ${GIT_COMMIT}
      DEPLOYMENT_ENV: compose
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      POSTGRES_HOST: enrollment-postgresql
      POSTGRES_DB: ${ENROLLMENT_DB_NAME}
      POSTGRES_USER: ${ENROLLMENT_DB_USER}
      POSTGRES_PASSWORD: ${ENROLLMENT_DB_PASSWORD}
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
    ports:
      - "8083:8080"
    depends_on:
      enrollment-db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION}
        GIT_COMMIT: ${GIT_COMMIT}
        BUILD_DATE: ${BUILD_DATE}
    image: learnhub/payment-service:${APP_VERSION}
    environment:
      SERVICE_NAME: payment-service
      PORT: "8080"
      APP_VERSION: ${APP_VERSION}
      RELEASE_ID: ${RELEASE_ID}
      GIT_COMMIT: ${GIT_COMMIT}
      DEPLOYMENT_ENV: compose
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      POSTGRES_HOST: payment-postgresql
      POSTGRES_DB: ${PAYMENT_DB_NAME}
      POSTGRES_USER: ${PAYMENT_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
      NATS_URL: nats://nats:4222
    ports:
      - "8084:8080"
    depends_on:
      payment-db-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION}
        GIT_COMMIT: ${GIT_COMMIT}
        BUILD_DATE: ${BUILD_DATE}
    image: learnhub/notification-service:${APP_VERSION}
    environment:
      SERVICE_NAME: notification-service
      PORT: "8080"
      APP_VERSION: ${APP_VERSION}
      RELEASE_ID: ${RELEASE_ID}
      GIT_COMMIT: ${GIT_COMMIT}
      DEPLOYMENT_ENV: compose
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      POSTGRES_HOST: notification-postgresql
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      NATS_URL: nats://nats:4222
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    ports:
      - "8085:8080"
    depends_on:
      notification-db-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started

volumes:
  user-postgresql-data:
  course-postgresql-data:
  enrollment-postgresql-data:
  payment-postgresql-data:
  notification-postgresql-data:
  nats-data:
  minio-data:
