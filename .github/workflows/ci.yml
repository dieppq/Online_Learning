name: learnhub-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4

      - name: Test Go services
        run: go test ./...

      - name: Render Kustomize overlays
        run: |
          kubectl kustomize capstone/k8s/overlays/dev >/dev/null
          kubectl kustomize capstone/k8s/overlays/prod >/dev/null

      - name: Lint Helm charts
        shell: bash
        run: |
          for chart in capstone/helm/*; do
            if [ -f "$chart/Chart.yaml" ]; then
              helm dependency update "$chart"
              helm lint "$chart"
            fi
          done

      - name: Validate Compose parity
        run: docker compose --env-file configs/env/local.env.example config --quiet

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - user-service
          - course-service
          - enrollment-service
          - payment-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable service image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/learnhub-${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=sha-${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true
      - name: Record image digest
        run: echo "${{ matrix.service }} ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
