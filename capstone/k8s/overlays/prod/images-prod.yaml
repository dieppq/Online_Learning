apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: web
          image: learnhub/web-ui:1.0.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: main
          image: learnhub/user-service:1.0.0
          env:
            - name: SERVICE_NAME
              value: user-service
            - name: APP_VERSION
              value: "1.0.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrollment-service
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: main
          image: learnhub/enrollment-service:1.0.0
          env:
            - name: SERVICE_NAME
              value: enrollment-service
            - name: APP_VERSION
              value: "1.0.0"
---
apiVersion: apps/v1
