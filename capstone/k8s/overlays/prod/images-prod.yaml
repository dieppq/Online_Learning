---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service-blue
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: main
          image: learnhub/course-service:1.0.0
          env:
            - name: SERVICE_NAME
              value: course-service
            - name: APP_VERSION
              value: "1.0.0"
            - name: COURSE_TRACK
              value: blue
