apiVersion: batch/v1
kind: Job
metadata:
  name: learnhub-secret-check
  labels:
    app.kubernetes.io/name: learnhub-secret-check
    app.kubernetes.io/part-of: learnhub
    app.kubernetes.io/component: config-check
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: learnhub-secret-check
        app.kubernetes.io/part-of: learnhub
        app.kubernetes.io/component: config-check
    spec:
      serviceAccountName: learnhub-app
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secret-check
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              test -n "$JWT_SECRET"
              test -n "$POSTGRES_PASSWORD"
              echo JWT_SECRET=present
              echo POSTGRES_PASSWORD=present
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: learnhub-secret
                  key: JWT_SECRET
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: learnhub-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

