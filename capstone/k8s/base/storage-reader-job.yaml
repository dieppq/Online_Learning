apiVersion: batch/v1
kind: Job
metadata:
  name: learnhub-pvc-reader-v2
  labels:
    app.kubernetes.io/name: learnhub-pvc-reader-v2
    app.kubernetes.io/part-of: learnhub
    app.kubernetes.io/component: storage-proof
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: learnhub-pvc-reader-v2
        app.kubernetes.io/part-of: learnhub
        app.kubernetes.io/component: storage-proof
    spec:
      serviceAccountName: learnhub-app
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reader
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              attempts=0
              until test -f /data/capstone.txt; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge 60 ]; then
                  echo "timed out waiting for PVC writer" >&2
                  exit 1
                fi
                sleep 2
              done
              cat /data/capstone.txt
          volumeMounts:
            - name: proof-data
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: proof-data
          persistentVolumeClaim:
            claimName: learnhub-proof-data
