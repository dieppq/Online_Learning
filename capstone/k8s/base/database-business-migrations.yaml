                ('l-01','c-k8s-ckad','Pod and namespace',18,1),
                ('l-02','c-k8s-ckad','Deployment and rollout',24,2),
                ('l-03','c-k8s-ckad','Service and internal DNS',21,3)
              ON CONFLICT DO NOTHING;
              INSERT INTO schema_migrations(version) VALUES ('002') ON CONFLICT DO NOTHING;
              SQL
              echo migration=course-service:002 status=applied
          envFrom:
            - secretRef:
                name: course-service-db
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
