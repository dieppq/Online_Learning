    metadata:
      labels:
        app.kubernetes.io/name: course-db-migrate
        app.kubernetes.io/part-of: learnhub
        app.kubernetes.io/component: migration
        learnhub.io/owner: course-service
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              until PGPASSWORD="$POSTGRES_PASSWORD" psql -h course-postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1" >/dev/null 2>&1; do sleep 2; done
              PGPASSWORD="$POSTGRES_PASSWORD" psql -v ON_ERROR_STOP=1 -h course-postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
              CREATE TABLE IF NOT EXISTS courses (
                id text PRIMARY KEY,
                title text NOT NULL,
                description text NOT NULL DEFAULT '',
                price integer NOT NULL CHECK (price >= 0),
                status text NOT NULL DEFAULT 'draft',
                created_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE TABLE IF NOT EXISTS lessons (
                id text PRIMARY KEY,
                course_id text NOT NULL REFERENCES courses(id) ON DELETE CASCADE,
                title text NOT NULL,
                duration_minutes integer NOT NULL CHECK (duration_minutes > 0),
                position integer NOT NULL,
                UNIQUE(course_id, position)
              );
              INSERT INTO courses(id,title,description,price,status) VALUES
                ('c-go-101','Go for backend services','Build practical Go HTTP services.',490000,'published'),
                ('c-k8s-ckad','Kubernetes CKAD hands-on','Deploy and debug LearnHub on Kubernetes.',790000,'published'),
                ('c-sql-basic','PostgreSQL for web applications','Relational data fundamentals.',390000,'published')
              ON CONFLICT DO NOTHING;
