apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service-green
  labels:
    app.kubernetes.io/name: course-service
    app.kubernetes.io/part-of: learnhub
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.2.0"
    track: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: course-service
      track: green
  template:
    metadata:
      labels:
        app.kubernetes.io/name: course-service
        app.kubernetes.io/part-of: learnhub
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "0.2.0"
        track: green
    spec:
      serviceAccountName: learnhub-app
      securityContext:
        runAsNonRoot: true
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: runtime-config
          emptyDir: {}
        - name: proxy-logs
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
      initContainers:
        - name: init-runtime-config
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /runtime
              {
                echo SERVICE_NAME=course-service
                echo APP_VERSION=0.2.0
                echo COURSE_TRACK=green
                echo CONFIG_SOURCE=init-container
              } > /runtime/app.env
              cat /runtime/app.env
          volumeMounts:
            - name: runtime-config
              mountPath: /runtime
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 2000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: main
          image: learnhub/course-service:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: main-http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: learnhub-config
            - secretRef:
                name: learnhub-secret
          env:
            - name: SERVICE_NAME
              value: course-service
            - name: APP_VERSION
              value: "0.2.0"
            - name: COURSE_TRACK
              value: green
          volumeMounts:
            - name: runtime-config
              mountPath: /runtime
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: main-http
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: main-http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: main-http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: ambassador-proxy
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy-http
              containerPort: 8081
          command:
            - sh
            - -c
            - |
              set -eu
              cat > /tmp/nginx.conf <<'EOF'
              pid /tmp/nginx.pid;
              events {}
              http {
                client_body_temp_path /tmp/client_body;
                proxy_temp_path /tmp/proxy;
                fastcgi_temp_path /tmp/fastcgi;
                uwsgi_temp_path /tmp/uwsgi;
                scgi_temp_path /tmp/scgi;
                access_log /var/log/learnhub/access.log;
                error_log /var/log/learnhub/error.log info;
                server {
                  listen 8081;
                  location / {
                    proxy_pass http://127.0.0.1:8080;
                    proxy_set_header Host $host;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-LearnHub-Track green;
                  }
                }
              }
              EOF
              nginx -c /tmp/nginx.conf -g 'daemon off;'
          volumeMounts:
            - name: proxy-logs
              mountPath: /var/log/learnhub
            - name: nginx-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: proxy-http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: proxy-http
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 2000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: log-tailer
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              while [ ! -f /var/log/learnhub/access.log ]; do sleep 1; done
              tail -n +1 -F /var/log/learnhub/access.log /var/log/learnhub/error.log
          volumeMounts:
            - name: proxy-logs
              mountPath: /var/log/learnhub
              readOnly: true
            - name: runtime-config
              mountPath: /runtime
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 2000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

