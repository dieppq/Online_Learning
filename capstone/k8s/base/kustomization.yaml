apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - rbac.yaml
  - quota-limitrange.yaml
  - storage-proof.yaml
  - user-postgresql.yaml
  - course-postgresql.yaml
  - enrollment-postgresql.yaml
  - payment-postgresql.yaml
  - notification-postgresql.yaml
  - redis.yaml
  - nats.yaml
  - minio.yaml
  - web-ui.yaml
  - user-service.yaml
  - course-service-blue.yaml
  - course-service-green.yaml
  - enrollment-service.yaml
  - payment-service.yaml
  - notification-service.yaml
  - database-migrations.yaml
  - database-business-migrations.yaml
  - database-reliability-migrations.yaml
  - hpa.yaml
  - secret-check-job.yaml
  - storage-reader-job.yaml
  - api-access-cronjob.yaml
  - ingress.yaml
  - networkpolicy.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: app.kubernetes.io/component in (api,worker)
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          prometheus.io/scrape: "true"
          prometheus.io/path: /metrics
          prometheus.io/port: "8080"
  - target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: app.kubernetes.io/component=database
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
      - op: replace
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 70
          runAsGroup: 70
          fsGroup: 70
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: redis
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: nats
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: minio
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
