apiVersion: batch/v1
kind: Job
metadata:
  name: course-db-migrate-v003
  labels:
    app.kubernetes.io/name: course-db-migrate
    app.kubernetes.io/part-of: learnhub
    app.kubernetes.io/component: migration
    app.kubernetes.io/version: "003"
    learnhub.io/owner: course-service
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: course-db-migrate
        app.kubernetes.io/part-of: learnhub
        app.kubernetes.io/component: migration
        learnhub.io/owner: course-service
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              until PGPASSWORD="$POSTGRES_PASSWORD" psql -h course-postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1" >/dev/null 2>&1; do sleep 2; done
              PGPASSWORD="$POSTGRES_PASSWORD" psql -v ON_ERROR_STOP=1 -h course-postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
              ALTER TABLE lessons ADD COLUMN IF NOT EXISTS content_object_key text;
              ALTER TABLE lessons ADD COLUMN IF NOT EXISTS content_type text;
              ALTER TABLE lessons ADD COLUMN IF NOT EXISTS content_size bigint CHECK (content_size >= 0);
              INSERT INTO schema_migrations(version) VALUES ('003') ON CONFLICT DO NOTHING;
              SQL
              echo migration=course-service:003 status=applied
          envFrom:
            - secretRef:
                name: course-service-db
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: enrollment-db-migrate-v003
  labels:
    app.kubernetes.io/name: enrollment-db-migrate
    app.kubernetes.io/part-of: learnhub
    app.kubernetes.io/component: migration
    app.kubernetes.io/version: "003"
    learnhub.io/owner: enrollment-service
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enrollment-db-migrate
        app.kubernetes.io/part-of: learnhub
        app.kubernetes.io/component: migration
        learnhub.io/owner: enrollment-service
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              until PGPASSWORD="$POSTGRES_PASSWORD" psql -h enrollment-postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1" >/dev/null 2>&1; do sleep 2; done
              PGPASSWORD="$POSTGRES_PASSWORD" psql -v ON_ERROR_STOP=1 -h enrollment-postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
              CREATE TABLE IF NOT EXISTS outbox_events (
                id text PRIMARY KEY,
                subject text NOT NULL,
                payload jsonb NOT NULL,
                published_at timestamptz,
                attempts integer NOT NULL DEFAULT 0,
                last_error text,
                created_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX IF NOT EXISTS outbox_events_pending_idx ON outbox_events(created_at) WHERE published_at IS NULL;
              INSERT INTO schema_migrations(version) VALUES ('003') ON CONFLICT DO NOTHING;
              SQL
              echo migration=enrollment-service:003 status=applied
          envFrom:
            - secretRef:
                name: enrollment-service-db
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
