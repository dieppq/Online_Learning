apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: learnhub-proof-data
  labels:
    app.kubernetes.io/name: learnhub-proof-data
    app.kubernetes.io/part-of: learnhub
    app.kubernetes.io/component: storage-proof
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: learnhub-pvc-writer
  labels:
    app.kubernetes.io/name: learnhub-pvc-writer
    app.kubernetes.io/part-of: learnhub
    app.kubernetes.io/component: storage-proof
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: learnhub-pvc-writer
        app.kubernetes.io/part-of: learnhub
        app.kubernetes.io/component: storage-proof
    spec:
      serviceAccountName: learnhub-app
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: writer
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              date -u > /data/written-at.txt
              echo learnhub-capstone-pvc-ok > /data/capstone.txt
              cat /data/capstone.txt
          volumeMounts:
            - name: proof-data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: proof-data
          persistentVolumeClaim:
            claimName: learnhub-proof-data

