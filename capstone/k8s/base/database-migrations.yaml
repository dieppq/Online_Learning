apiVersion: batch/v1
kind: Job
metadata:
  name: user-db-migrate-v001
  labels:
    app.kubernetes.io/name: user-db-migrate
    app.kubernetes.io/part-of: learnhub
    app.kubernetes.io/component: migration
    app.kubernetes.io/version: "001"
    learnhub.io/owner: user-service
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-db-migrate
        app.kubernetes.io/part-of: learnhub
        app.kubernetes.io/component: migration
        learnhub.io/owner: user-service
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              until PGPASSWORD="$POSTGRES_PASSWORD" psql -h user-postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1" >/dev/null 2>&1; do sleep 2; done
              PGPASSWORD="$POSTGRES_PASSWORD" psql -v ON_ERROR_STOP=1 -h user-postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
              CREATE TABLE IF NOT EXISTS schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now());
              INSERT INTO schema_migrations(version) VALUES ('001') ON CONFLICT DO NOTHING;
              SQL
              echo migration=user-service:001 status=applied
          envFrom:
            - secretRef:
                name: user-service-db
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
