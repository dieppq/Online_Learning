apiVersion: v1
kind: Namespace
metadata:
  name: ckad-lab
  labels:
    purpose: ckad
---
apiVersion: batch/v1
kind: Job
metadata:
  name: learnhub-daily-report
  namespace: ckad-lab
  labels:
    app: learnhub
    component: report
    lab: "1.3"
    workload: job
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: learnhub
        component: report
        lab: "1.3"
        workload: job
    spec:
      restartPolicy: Never
      containers:
        - name: report-runner
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              set -eu
              echo "LearnHub one-off report started: daily course progress summary"
              echo "job=$HOSTNAME"
              echo "checking real LearnHub service readiness..."
              curl --fail --silent --show-error "$COURSE_SERVICE_URL/readyz"
              echo
              curl --fail --silent --show-error "$ENROLLMENT_SERVICE_URL/readyz"
              echo
              curl --fail --silent --show-error "$NOTIFICATION_SERVICE_URL/readyz"
              echo
              echo "fetching course catalog from course-service..."
              curl --fail --silent --show-error "$COURSE_SERVICE_URL/api/courses"
              echo
              echo "fetching student progress from enrollment-service..."
              curl --fail --silent --show-error "$ENROLLMENT_SERVICE_URL/api/progress/u-1001/c-k8s-ckad"
              echo
              echo "queueing daily report email through notification-service..."
              curl --fail --silent --show-error \
                -X POST "$NOTIFICATION_SERVICE_URL/api/notifications/email" \
                -H "Content-Type: application/json" \
                -d '{"recipient":"instructor@example.com","subject":"LearnHub daily progress report","body":"Daily course progress report generated by Kubernetes Job"}'
              echo
              echo "LearnHub one-off report finished"
          env:
            - name: COURSE_SERVICE_URL
              value: http://course-service.learnhub-lab.svc.cluster.local
            - name: ENROLLMENT_SERVICE_URL
              value: http://enrollment-service.learnhub-lab.svc.cluster.local
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service.learnhub-lab.svc.cluster.local
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: learnhub-reminder-cronjob
  namespace: ckad-lab
  labels:
    app: learnhub
    component: reminder
    lab: "1.3"
    workload: cronjob
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 60
  jobTemplate:
    metadata:
      labels:
        app: learnhub
        component: reminder
        lab: "1.3"
        workload: cronjob-child
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 90
      template:
        metadata:
          labels:
            app: learnhub
            component: reminder
            lab: "1.3"
            workload: cronjob-child
        spec:
          restartPolicy: OnFailure
          containers:
            - name: reminder-runner
              image: curlimages/curl:8.10.1
              command:
                - sh
                - -c
                - |
                  set -eu
                  echo "LearnHub scheduled inactive-student reminder started"
                  echo "job=$HOSTNAME"
                  echo "fetching student profile from user-service..."
                  curl --fail --silent --show-error "$USER_SERVICE_URL/api/users/u-1001"
                  echo
                  echo "checking course progress from enrollment-service..."
                  curl --fail --silent --show-error "$ENROLLMENT_SERVICE_URL/api/progress/u-1001/c-k8s-ckad"
                  echo
                  echo "queueing course reminder through notification-service..."
                  curl --fail --silent --show-error \
                    -X POST "$NOTIFICATION_SERVICE_URL/api/notifications/course-reminder" \
                    -H "Content-Type: application/json" \
                    -d '{"user_id":"u-1001","course_id":"c-k8s-ckad","reason":"inactive_student"}'
                  echo
                  echo "LearnHub scheduled reminder finished"
              env:
                - name: USER_SERVICE_URL
                  value: http://user-service.learnhub-lab.svc.cluster.local
                - name: ENROLLMENT_SERVICE_URL
                  value: http://enrollment-service.learnhub-lab.svc.cluster.local
                - name: NOTIFICATION_SERVICE_URL
                  value: http://notification-service.learnhub-lab.svc.cluster.local
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
