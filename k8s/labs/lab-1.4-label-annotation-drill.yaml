apiVersion: v1
kind: Namespace
metadata:
  name: label-lab
  labels:
    purpose: ckad
    lab: "1.4"
---
apiVersion: v1
kind: Pod
metadata:
  name: user-api-1
  namespace: label-lab
  labels:
    app: learnhub
    component: user
    tier: api
    env: dev
    track: blue
  annotations:
    learnhub.io/owner: platform-team
    learnhub.io/note: lab-1.4-initial
spec:
  restartPolicy: Never
  containers:
    - name: user-service
      image: learnhub/user-service:0.1.0
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
      env:
        - name: SERVICE_NAME
          value: user-service
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
---
