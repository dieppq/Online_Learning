apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnhub-course-helm
  labels:
    app.kubernetes.io/name: learnhub-course-helm
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: learnhub
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: learnhub-course-helm
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: learnhub-course-helm
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: learnhub
    spec:
      containers:
        - name: course-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: SERVICE_NAME
              value: {{ .Values.serviceName | quote }}
            - name: APP_VERSION
              value: {{ .Values.appVersion | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
