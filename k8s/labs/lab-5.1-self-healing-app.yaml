apiVersion: v1
kind: Namespace
metadata:
  name: probe-lab
  labels:
    purpose: ckad
    lab: "5.1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnhub-self-healing
  namespace: probe-lab
  labels:
    app: learnhub-self-healing
    component: course
    lab: "5.1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: learnhub-self-healing
  template:
    metadata:
      labels:
        app: learnhub-self-healing
        component: course
        lab: "5.1"
    spec:
      containers:
        - name: probe-app
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /www
              echo "learnhub probe app course_id=c-k8s-ckad" > /www/index.html
              echo "ok" > /www/healthz
              (
                sleep 10
                echo "ready" > /tmp/ready
                echo "ready course_id=c-k8s-ckad" > /www/readyz
              ) &
              httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -f /tmp/ready
            periodSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: learnhub-self-healing
  namespace: probe-lab
  labels:
    app: learnhub-self-healing
    lab: "5.1"
spec:
  type: ClusterIP
  selector:
    app: learnhub-self-healing
  ports:
    - name: http
      port: 80
      targetPort: http
