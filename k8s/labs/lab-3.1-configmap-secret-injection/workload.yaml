apiVersion: v1
kind: Namespace
metadata:
  name: config-lab
  labels:
    purpose: ckad
    lab: "3.1"
---
apiVersion: v1
kind: Pod
metadata:
  name: learnhub-configured-course
  labels:
    app: learnhub-configured-course
    component: course
    lab: "3.1"
spec:
  volumes:
    - name: course-runtime-config
      configMap:
        name: learnhub-course-runtime
  containers:
    - name: course-service
      image: learnhub/course-service:0.1.0
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
      env:
        - name: SERVICE_NAME
          value: course-service-config
        - name: APP_VERSION
          value: "0.1.0"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: learnhub-jwt-secret
              key: JWT_SECRET
      volumeMounts:
        - name: course-runtime-config
          mountPath: /etc/learnhub-config
          readOnly: true
      readinessProbe:
        httpGet:
          path: /readyz
          port: http
        initialDelaySeconds: 3
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 10
        periodSeconds: 10
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
    - name: config-reader
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - sleep 3600
      env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: learnhub-jwt-secret
              key: JWT_SECRET
      volumeMounts:
        - name: course-runtime-config
          mountPath: /etc/learnhub-config
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: learnhub-configured-course
  labels:
    app: learnhub-configured-course
    component: course
    lab: "3.1"
spec:
  type: ClusterIP
  selector:
    app: learnhub-configured-course
  ports:
    - name: http
      port: 80
      targetPort: http
