apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: config-lab

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: learnhub-course-runtime
    literals:
      - COURSE_ID=c-k8s-ckad
      - LOG_LEVEL=debug
      - COURSE_SERVICE_URL=http://learnhub-configured-course

resources:
  - workload.yaml
