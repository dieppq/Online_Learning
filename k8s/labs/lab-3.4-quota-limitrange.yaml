apiVersion: v1
kind: Namespace
metadata:
  name: quota-lab
  labels:
    purpose: ckad
    lab: "3.4"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: learnhub-app-quota
  namespace: quota-lab
  labels:
    app: learnhub-quota
    lab: "3.4"
spec:
  hard:
    pods: "2"
    requests.cpu: 200m
    requests.memory: 256Mi
    limits.cpu: 800m
    limits.memory: 512Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: learnhub-default-limits
  namespace: quota-lab
  labels:
    app: learnhub-quota
    lab: "3.4"
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 128Mi
      max:
        cpu: 500m
        memory: 256Mi
