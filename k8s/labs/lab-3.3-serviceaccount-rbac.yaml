apiVersion: v1
kind: Namespace
metadata:
  name: rbac-lab
  labels:
    purpose: ckad
    lab: "3.3"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: learnhub-pod-reader
  namespace: rbac-lab
  labels:
    app: learnhub-rbac
    lab: "3.3"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: learnhub-pod-reader
  namespace: rbac-lab
  labels:
    app: learnhub-rbac
    lab: "3.3"
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: learnhub-pod-reader
  namespace: rbac-lab
  labels:
    app: learnhub-rbac
    lab: "3.3"
subjects:
  - kind: ServiceAccount
    name: learnhub-pod-reader
    namespace: rbac-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: learnhub-pod-reader
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: learnhub-rbac-scripts
  namespace: rbac-lab
  labels:
    app: learnhub-rbac
    lab: "3.3"
data:
  list-pods.sh: |
    #!/bin/sh
    set -eu

    token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
    ca_cert="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    namespace="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"

    curl --fail --silent --show-error \
      --cacert "$ca_cert" \
      -H "Authorization: Bearer $token" \
      "https://kubernetes.default.svc/api/v1/namespaces/$namespace/pods"
  deny-secrets.sh: |
    #!/bin/sh
    set -eu

    token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
    ca_cert="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    namespace="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"

    code="$(curl --silent --show-error \
      --output /tmp/secrets-response.json \
      --write-out "%{http_code}" \
      --cacert "$ca_cert" \
      -H "Authorization: Bearer $token" \
      "https://kubernetes.default.svc/api/v1/namespaces/$namespace/secrets")"

    echo "HTTP_CODE=$code"
    test "$code" = "403"
---
apiVersion: v1
kind: Pod
metadata:
  name: learnhub-rbac-api
  namespace: rbac-lab
  labels:
    app: learnhub-rbac
    component: course
    lab: "3.3"
spec:
  containers:
    - name: course-service
      image: learnhub/course-service:0.1.0
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
      env:
        - name: SERVICE_NAME
          value: course-service-rbac
        - name: APP_VERSION
          value: "0.1.0"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: learnhub-rbac-client
  namespace: rbac-lab
  labels:
    app: learnhub-rbac
    component: kubernetes-api-client
    lab: "3.3"
spec:
  serviceAccountName: learnhub-pod-reader
  automountServiceAccountToken: true
  volumes:
    - name: rbac-scripts
      configMap:
        name: learnhub-rbac-scripts
        defaultMode: 0555
  containers:
    - name: api-client
      image: curlimages/curl:8.10.1
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - sleep 3600
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      volumeMounts:
        - name: rbac-scripts
          mountPath: /scripts
          readOnly: true
