apiVersion: v1
kind: Namespace
metadata:
  name: service-lab
  labels:
    purpose: ckad
    lab: "4.1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnhub-course-backend
  namespace: service-lab
  labels:
    app: learnhub-course
    role: backend
    component: course
    lab: "4.1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learnhub-course
      role: backend
  template:
    metadata:
      labels:
        app: learnhub-course
        role: backend
        component: course
        lab: "4.1"
    spec:
      containers:
        - name: course-service
          image: learnhub/course-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: course-service-backend
            - name: APP_VERSION
              value: "0.1.0"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: learnhub-course-backend
  namespace: service-lab
  labels:
    app: learnhub-course
    role: backend
    lab: "4.1"
spec:
  type: ClusterIP
  selector:
    app: learnhub-course
    role: backend-mismatch
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnhub-user-frontend
  namespace: service-lab
  labels:
    app: learnhub-user
    role: frontend
    component: user
    lab: "4.1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learnhub-user
      role: frontend
  template:
    metadata:
      labels:
        app: learnhub-user
        role: frontend
        component: user
        lab: "4.1"
    spec:
      containers:
        - name: user-service
          image: learnhub/user-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: user-service-frontend
            - name: APP_VERSION
              value: "0.1.0"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: learnhub-user-frontend
  namespace: service-lab
  labels:
    app: learnhub-user
    role: frontend
    lab: "4.1"
spec:
  type: NodePort
  selector:
    app: learnhub-user
    role: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
