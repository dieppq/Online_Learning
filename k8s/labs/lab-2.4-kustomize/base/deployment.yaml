apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnhub-course-kustomize
  labels:
    app: learnhub-course-kustomize
    component: course
    lab: "2.4"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learnhub-course-kustomize
  template:
    metadata:
      labels:
        app: learnhub-course-kustomize
        component: course
        lab: "2.4"
    spec:
      containers:
        - name: course-service
          image: learnhub/course-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: course-service-kustomize
            - name: APP_VERSION
              value: "0.1.0"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
