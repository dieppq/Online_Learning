apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnhub-course-scale
  namespace: scale-lab
  labels:
    app: learnhub-course-scale
    component: course
    lab: "2.3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learnhub-course-scale
  template:
    metadata:
      labels:
        app: learnhub-course-scale
        component: course
        lab: "2.3"
    spec:
      containers:
        - name: course-service
          image: learnhub/course-service:0.1.0-cpu
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: course-service-scale
            - name: APP_VERSION
              value: "0.1.0-cpu"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
