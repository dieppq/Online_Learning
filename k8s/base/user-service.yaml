apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: learnhub-lab
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: learnhub
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/part-of: learnhub
        app.kubernetes.io/component: api
    spec:
      volumes:
        - name: runtime-config
          emptyDir: {}
        - name: proxy-logs
          emptyDir: {}
      initContainers:
        - name: init-load-config
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /runtime
              echo "SERVICE_NAME=user-service" > /runtime/app.env
              echo "POSTGRES_HOST=postgresql" >> /runtime/app.env
              for i in $(seq 1 30); do
                if pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; then
                  echo "$POSTGRES_HOST:$POSTGRES_PORT is ready"
                  exit 0
                fi
                echo "waiting for $POSTGRES_HOST:$POSTGRES_PORT attempt=$i"
                sleep 2
              done
              echo "$POSTGRES_HOST:$POSTGRES_PORT is not ready"
              exit 1
          env:
            - name: POSTGRES_HOST
              value: postgresql
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: learnhub-secret
                  key: POSTGRES_USER
          volumeMounts:
            - name: runtime-config
              mountPath: /runtime
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: main
          image: learnhub/user-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: main-http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: learnhub-config
            - secretRef:
                name: learnhub-secret
          env:
            - name: SERVICE_NAME
              value: user-service
          volumeMounts:
            - name: runtime-config
              mountPath: /runtime
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: main-http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: main-http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
        - name: ambassador-proxy
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy-http
              containerPort: 8081
          command:
            - sh
            - -c
            - |
              set -eu
              cat > /tmp/nginx.conf <<'EOF'
              events {}
              http {
                access_log /var/log/learnhub/access.log;
                error_log /var/log/learnhub/error.log info;
                server {
                  listen 8081;
                  location / {
                    proxy_pass http://127.0.0.1:8080;
                    proxy_set_header Host $host;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-LearnHub-Ambassador user-service;
                  }
                }
              }
              EOF
              nginx -c /tmp/nginx.conf -g 'daemon off;'
          volumeMounts:
            - name: proxy-logs
              mountPath: /var/log/learnhub
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: proxy-http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: proxy-http
            initialDelaySeconds: 15
            periodSeconds: 10
        - name: log-sidecar
          image: fluent/fluent-bit:3.2.10
          args:
            - -i
            - tail
            - -p
            - Path=/var/log/learnhub/*.log
            - -p
            - Read_from_Head=true
            - -p
            - Tag=learnhub.user-service.proxy
            - -o
            - stdout
            - -m
            - "*"
          volumeMounts:
            - name: proxy-logs
              mountPath: /var/log/learnhub
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: learnhub-lab
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: learnhub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: user-service
  ports:
    - name: http
      port: 80
      targetPort: proxy-http
