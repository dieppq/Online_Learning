apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: learnhub-api
  namespace: learnhub-lab
  labels:
    app.kubernetes.io/name: learnhub-api
    app.kubernetes.io/part-of: learnhub
spec:
  ingressClassName: nginx
  rules:
    - host: learnhub.local
      http:
        paths:
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  name: http
          - path: /api/courses
            pathType: Prefix
            backend:
              service:
                name: course-service
                port:
                  name: http
          - path: /api/enrollments
            pathType: Prefix
            backend:
              service:
                name: enrollment-service
                port:
                  name: http
          - path: /api/progress
            pathType: Prefix
            backend:
              service:
                name: enrollment-service
                port:
                  name: http
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  name: http
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  name: http

